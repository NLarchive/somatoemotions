name: Publish static site
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: |
          output="$RUNNER_TEMP/pages"
          mkdir -p "$output"
          git archive HEAD | tar -xf - -C "$output"
          rm -rf "$output/.github"
          rm -f "$output/.pages-publisher-files.json" "$output/pages-publisher-v1.txt"
          test -s "$output/index.html"
          printf '%s\n' "$GITHUB_SHA" > "$output/pages-publisher-revision.txt"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ runner.temp }}/pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deploy
